<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EtiquetAI | Acceso</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="loginPage" class="container login-container">
      <div class="brand" aria-label="EtiquetAI">
        <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-labelledby="brandMarkTitle">
          <title id="brandMarkTitle">Código QR de EtiquetAI</title>
          <path d="M8 8h18v6H14v12H8V8Zm32 0h16v18h-6V14H40V8ZM8 38h6v12h12v6H8V38Zm42 0h6v18H38v-6h12V38Z" fill="currentColor" />
          <path d="M22 22h20v20H22V22Zm6 6v8h8v-8h-8Z" fill="currentColor" />
          <path d="M43 43h6v6h-6v-6Z" fill="#f7c948" />
        </svg>
        <span class="brand-name">Etiquet<span>AI</span></span>
      </div>
      <h1>Iniciar sesión</h1>
      <p class="login-subtitle">Control inteligente para tus paquetes.</p>
      <form id="loginForm" class="login-form">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" required />

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button type="submit">Ingresar</button>
        <p id="loginError" class="login-error" role="alert" hidden>Usuario o contraseña incorrectos.</p>
      </form>
    </main>

    <script>
      document.getElementById("loginForm").addEventListener("submit", function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const loginError = document.getElementById("loginError");

        if (username === "fiuba" && password === "1234") {
          window.location.href = "EtiquetAI.html";
          return;
        }

        loginError.hidden = false;
      });
    </script>
  </body>
</html>
