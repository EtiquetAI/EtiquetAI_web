name: Web CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (type-check and bundle)
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Type-check Playwright tests
        run: npm run test:e2e:types

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Build
        run: npm run build
