<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EtiquetAI | Acceso</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="loginPage" class="container login-container">
      <div class="brand" aria-label="EtiquetAI">
        <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-labelledby="brandMarkTitle">
          <title id="brandMarkTitle">Código QR de EtiquetAI</title>
          <path d="M8 8h18v6H14v12H8V8Zm32 0h16v18h-6V14H40V8ZM8 38h6v12h12v6H8V38Zm42 0h6v18H38v-6h12V38Z" fill="currentColor" />
          <path d="M22 22h20v20H22V22Zm6 6v8h8v-8h-8Z" fill="currentColor" />
          <path d="M43 43h6v6h-6v-6Z" fill="#f7c948" />
        </svg>
        <span class="brand-name">Etiquet<span>AI</span></span>
      </div>
      <h1>Iniciar sesión</h1>
      <p class="login-subtitle">Control inteligente para tus paquetes.</p>
      <form id="loginForm" class="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button id="loginButton" type="submit">Ingresar</button>
        <p id="loginError" class="login-error" role="alert" hidden>Email o contraseña incorrectos.</p>
      </form>
    </main>

    <main id="appPage" class="container" hidden>
      <header class="app-header">
        <div class="brand" aria-label="EtiquetAI">
          <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-labelledby="appBrandMarkTitle">
            <title id="appBrandMarkTitle">Código QR de EtiquetAI</title>
            <path d="M8 8h18v6H14v12H8V8Zm32 0h16v18h-6V14H40V8ZM8 38h6v12h12v6H8V38Zm42 0h6v18H38v-6h12V38Z" fill="currentColor" />
            <path d="M22 22h20v20H22V22Zm6 6v8h8v-8h-8Z" fill="currentColor" />
            <path d="M43 43h6v6h-6v-6Z" fill="#f7c948" />
          </svg>
          <span class="brand-name">Etiquet<span>AI</span></span>
        </div>
        <div>
          <h1>Escáner QR</h1>
          <p class="app-kicker">Trazabilidad de paquetes</p>
        </div>
        <div class="app-actions">
          <p id="currentUser" class="app-user" aria-live="polite"></p>
          <button id="logoutButton" type="button">Cerrar sesión</button>
        </div>
      </header>
      <div class="controls">
        <button id="startBtn">Iniciar cámara</button>
        <button id="stopBtn" disabled>Detener</button>
        <label style="margin-left:12px">Backend URL: <input id="backendUrl" placeholder="https://mi.api/qr" style="width:260px" /></label>
        <label style="margin-left:8px"><input type="checkbox" id="enableReport" /> Enviar al backend</label>
      </div>
      <div class="viewer">
        <video id="video" autoplay playsinline></video>
        <canvas id="overlay" hidden></canvas>
      </div>
      <section>
        <h2>Códigos detectados</h2>
        <ul id="codesList"></ul>
        <div id="reportStatus" style="margin-top:8px;color:#555"></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
